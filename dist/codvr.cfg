# =========================================================================
#  Call of Duty (2003) -- VR configuration
#
#  Lives beside opengl32.dll in the game folder. Read once at startup, so
#  changes take effect on the next launch.
#
#  Format: one "name value" pair per line. Lines starting with # are ignored.
#  Nothing here needs a rebuild -- every setting is read at runtime.
# =========================================================================


# ------------------------------------------------------------ IMAGE QUALITY

# SUPERSAMPLING. Each headset eye is about 3072x3264, far more than the game
# draws on its own, so without this the image is upscaled and soft. Rendering is
# redirected into an offscreen target this many times the game's resolution and
# sampled down once for the headset. The engine's own coordinates are scaled to
# match, so the HUD sharpens along with the world.
#
# Paired with the square 1440x1440 buffer set in Main/autoexec.cfg, 2.25 renders
# 3240x3240 -- almost exactly one eye.
#
# Lower this first if the frame rate suffers: 1.75 and 1.5 still look good.
# 1.0 disables it entirely and draws straight into the game's own buffer.
supersample 2.25


# ------------------------------------------------------------------ COMFORT

# TUNNELLING VIGNETTE. Motion sickness in VR comes from seeing movement your
# body cannot feel. Narrowing the field of view while you move or turn removes
# the peripheral motion that causes it, and it opens back up when you stop.
#
# OFF by default (your preference). Set 1 to enable. Every comfort option here
# is independent -- nothing turns anything else on.
vignette 0

# How far it closes at full speed. 1.0 is a strong tunnel, 0.5 is subtle.
vignetteStrength 1.0

# How much motion it takes to START closing. Below these values the tunnel
# stays fully open; it closes gradually above them and is FULLY closed at four
# times the value. RAISE these to make the vignette rarer and weaker; LOWER
# them if you still feel uneasy.
#   speed: engine units per second of travel (walking is roughly 100, so the
#          default starts a gentle tunnel at a slow walk and closes fully at
#          a 160-unit sprint)
#   turn : degrees per second of turning (snap turns are exempt -- a discrete
#          jump shows no continuous rotation, so it never triggers the tunnel)
vignetteSpeed 40
vignetteTurn 45

# SNAP TURN. Rotating in fixed steps instead of sweeping past the whole world is
# much gentler if you are sickness-prone. Set the step in degrees; 0 disables it
# and you simply turn with the mouse as normal. 30 or 45 are typical.
snapTurn 0

# Keys for snap turn, as "left,right". Only used when snapTurn is non-zero.
snapTurnKeys Q,E

# Snap turn works by feeding the game mouse movement, so its size depends on
# your in-game sensitivity. If a snap turns too far, lower this; too little,
# raise it.
snapMouseScale 4.0

# RECENTER. Makes wherever you are sitting and whichever way you are facing the
# new "straight ahead". Also on the LEFT STICK CLICK of the controllers.
# Keyboard key: accepts F1-F12, HOME, END, INSERT, DELETE, PAGEUP, PAGEDOWN,
# arrow keys, TAB, or a single letter/digit. Use "none" to unbind.
# (Changed from F9: your game config binds F9 to "loadgame quicksave", so the
# old default loaded a save every time you recentred.)
recenterKey HOME


# ---------------------------------------------------------------------- VIEW

# WORLD SCALE: engine units per real-world metre. CoD's own mapping standard
# (official CoD Radiant gameplay docs) is 1 world unit = 1 inch = 0.0254 m --
# the player is 72 units = 6 ft tall with eye level ~64 units -- so 39.37 is
# the engine's true scale, not a guess. RAISE it to make the world feel larger
# and yourself smaller; LOWER it to feel like a giant. Small changes matter --
# try 36 or 42 before anything more extreme.
worldscale 39.37

# POSITIONAL TRACKING GAIN: how far physical head translation (leaning,
# stepping) moves the in-game camera. 1.0 is physically correct: 10 cm of real
# movement is 10 cm in the world. It scales ONLY head translation -- never the
# distance between your eyes -- so stereo depth is unaffected. Lower it below
# 1.0 only if real head movement feels exaggerated; that would indicate a
# scale problem worth reporting, not a preference.
positionalgain 1.0

# CULLING FOV MARGIN: extra degrees per side added to the symmetric field of
# view the ENGINE uses for visibility culling. The actual image is drawn
# through each eye's true asymmetric projection (installed directly into
# OpenGL); this only keeps the engine from culling geometry near the view
# edges. Raise it if geometry ever pops at the edges of vision; the cost is a
# little overdraw.
cullmargin 5

# HUD DEPTH. The 2D overlay is drawn the same for both eyes, which puts it at
# infinite distance -- tiring to focus on with the world only a few metres away.
# This nudges it per eye so it sits at roughly arm's length.
# Raise to bring the HUD closer, lower to push it away, 0 to leave it at
# infinity. If the HUD ever looks doubled, set this to 0.
hudshift 12

# HUD SHAPE. The render buffer is square, because that matches the headset's
# eye and wastes no pixels -- but the game lays its HUD out for a wide screen,
# so drawn directly it would come out stretched tall. This draws the 2D layer
# into a correctly-proportioned band instead.
#
# 1.777 is 16:9, matching how the HUD looked before VR. Use 1.333 for classic
# 4:3 proportions (a slightly larger, squarer HUD), or 0 to disable the
# correction and let the HUD stretch to fill the square.
hudAspect 1.777


# ================================================== NATIVE VR INTERACTION ===
#
# The controller layer: 6DoF motion-tracked weapon, head/weapon decoupling,
# stick locomotion and turning, physical iron sights, two-handed rifles.
# With no controllers tracked, everything below is dormant and the game
# behaves exactly like the previous (mouse-aim) build.

# ===========================================================================
# CAMERA-STABLE BASELINE (2026-08-23)
# ===========================================================================
# The 2026-08-23 headset run was physically intolerable: the two eyes were
# rendered 30.730 units apart against a true 2.456, on camera bases ~25 deg
# apart, because controller-derived weapon control was writing the camera.
#
# Every controller path that can move the VIEW is now off by default. The
# controllers still move you and still shoot -- only the camera is protected.
# Physical weapon control returns via the DObj bone controller, which poses
# the gun directly and never touches the view angles.
#
# Set this to 1 to re-arm controller view steering. It is NOT the comfortable
# configuration and it is not what the baseline was validated with.
vr_experimental_weapon 0

# Master switch. 1 = the dominant controller aims the weapon and the game's
# own view angles are steered to it; the headset owns the camera completely.
# 0 = legacy behavior (mouse aims, head free-looks on top).
# Forced to 0 unless vr_experimental_weapon is 1.
vr_aim_mode 0

# Which hand holds the weapon. right (default) or left. Left mirrors the
# whole control map: fire/turn move to the left controller, movement/utility
# to the right.
vr_dominant_hand right

# RETIRED and IGNORED. This used to re-pose the weapon through syscalls
# 37/38 -- which are CM_PointContents / CM_TransformedPointContents on
# &cg.refdef.vieworg, so it was rewriting the CAMERA, not the gun (7696 times
# in the 2026-08-23 run). The key still parses so old configs load; it can no
# longer enable anything.
vr_weapon_transform 0

# Where the weapon model hangs from the hand:
#   model - keep the model's own offset from the camera (default; preserves
#           recoil/sway animation offsets)
#   hand  - collapse it so the model anchor sits exactly on your grip
vr_weapon_anchor model

# Weapon-model calibration: position offset in world units along the weapon's
# own forward/left/up, then rotation in degrees. Applies to the rendered
# weapon AND the fire direction together, so they can never disagree.
# The log's "viewmodel baked offset" line tells you what the model itself
# carries if you want to counter it here.
vr_weapon_off_fwd 0
vr_weapon_off_left 0
vr_weapon_off_up 0
vr_weapon_pitch 0
vr_weapon_yaw 0
vr_weapon_roll 0

# ------------------------------------------------------------ CONTROLS

# Stick turning (dominant-hand stick X): smooth or snap. Independent knobs;
# neither is ever forced.
vr_turn_mode smooth
vr_smooth_turn_speed 180
vr_snap_angle 30

# Locomotion direction reference for the off-hand stick: hmd (you walk where
# you look) or offhand (you walk where the off controller points).
vr_move_direction hmd

# Button map (defaults follow your own game binds). Accepts key names,
# MOUSE1/2/3, WHEELUP/WHEELDOWN, SPACE, SHIFT, CTRL, ESC, or none.
#   Dominant: trigger=Fire, grip=ADS, A=Jump, B tap=Crouch, B hold=Prone,
#             stick click=Melee, stick X=turn (Y unused in the default layout)
#   Off hand: stick=move, click tap=Recenter/hold=VR Options, X tap=Reload/hold=Cycle, Y=Use,
#             trigger=Grenade slot, grip=two-hand support, menu=Esc
bindFire MOUSE1
bindAds M
bindJump SPACE
bindCrouch C
bindProne CTRL
bindMelee SHIFT
bindReload R
bindUse F
bindGrenade 4

// ---------------------------------------------------------- deliberate actions
//
// The 2026-08-23 hardware run threw three grenades and switched weapons three
// times without being asked. Both had the same cause: a high-traffic control
// wired straight to a one-shot action through a bare edge.
//
//   grenade  was the off-hand trigger PRESS. That trigger is the most
//            reflexively squeezed control on the controller, and CoD's grenade
//            bind is weapon slot '4' -- so a reflex squeeze switched the
//            weapon to grenades.
//   weapnext was dominant stick Y > 0.7 -- the TURN stick. A diagonal flick
//            while turning clears 0.7 trivially, and CoD's weapon cycle walks
//            through the grenade slot.
//
// Seconds the off-hand trigger must be held before a grenade is committed.
// A reflex squeeze does nothing. 0 restores the old instant-on-press bug.
vr_grenade_hold 0.45

// Where the weapon cycle lives. 'button' = off-hand X, a discrete control
// nothing else reads. 'stick' = the old dominant stick Y, kept only so the
// behaviour can be reproduced deliberately. Do not use 'stick' for play.
vr_weapon_cycle_binding x_hold
bindMenu ESC

# ------------------------------------------------------------ IRON SIGHTS

# Physical ADS: raise the weapon to your dominant eye and the game's own ADS
# state (weapalt) engages for accuracy -- the camera NEVER zooms, snaps or
# rotates; the sights align because the gun is physically at your eye.
# Forced to 0 unless vr_experimental_weapon is 1 (it depends on the
# controller-derived weapon pose).
vr_physical_ads 0
vr_ads_enter_dist 0.32
vr_ads_exit_dist 0.42
vr_ads_enter_angle 15
vr_ads_exit_angle 25

# The ADS accuracy state is a desired-state machine over the game's weapalt
# TOGGLE, owned by: manual (dominant grip held), physical (sights at the
# eye), and two-hand (support grip attached). The assumed game state resets
# on spawns/loads/weapon switches. vr_ads_hint 1 additionally lets the mod
# CORRECT its assumption from cgame's real zoom fraction (read at
# cgameAdsHintRva; the raw value is always logged in the WEAPON CHECK so a
# hardware run can validate the semantics before enabling).
vr_ads_hint 0
cgameAdsHintRva 0x11E15C

# ------------------------------------------------------------ TWO-HANDED

# Hold LEFT GRIP with your support hand forward on the rifle to hold it with
# two hands: the rear of the rifle stays anchored to the dominant hand, the
# barrel follows the line between your two physical hands, and roll stays
# with the dominant hand. While attached the game's ADS accuracy state is
# granted (a braced rifle shoots straight) -- the gun itself stays exactly
# where your hands put it: no auto-centering, no camera zoom or snap.
#
# Attach requires the support hand within vr_twohand_grab_radius metres of
# the rifle line, in front of the rear grip, within vr_twohand_dist reach.
# Release only on letting go of the grip or leaving the reach envelope
# (widened by release_radius - grab_radius, so the boundary cannot chatter).
# Attach/detach blends over vr_twohand_blend_time seconds (no snap).
# Forced to 0 unless vr_experimental_weapon is 1.
vr_twohand_enabled 0
vr_twohand_dist 0.75
vr_twohand_grab_radius 0.22
vr_twohand_release_radius 0.32
vr_twohand_blend_time 0.12

# ------------------------------------------------------------ HAPTICS

vr_haptics 1
vr_haptics_strength 0.8

# ------------------------------------------------------------ COMFORT (all optional)

# Physical crouch: duck below vr_crouch_drop metres under your neutral height
# and the game crouches. Off by default.
vr_physical_crouch 1
vr_crouch_drop 0.32

# Metres added to your standing height in game (seated play compensation).
vr_height_adjust 0

# ------------------------------------------------------------ MENU / HUD FIT

# Menus/briefings are fitted inside the part of the eye the lens actually
# shows, times this scale. Raise toward 1.0 for a bigger menu, lower if edges
# ever clip. 0.90 still clipped on all four edges on hardware (the runtime's
# reported fov overscans what the lens shows, and the pinned panel adds a few
# degrees whenever your head is off the pin). 0.65 adds margin for the
# latest hardware report. Adjustable in VR Options: Menu / loading size.
vr_menu_scale 0.65

// P3 2026-09-04: VR UI safe area. One inset on EVERY 2D surface -- menus,
// loading screens and the gameplay HUD -- aspect preserved, centred; the
// world keeps the full eye. scale multiplies the fits above/below; safe_x /
// safe_y bound the usable fraction of the visible rectangle per axis.
vr_ui_scale 0.92
vr_ui_safe_x 1.0
vr_ui_safe_y 1.0

# Menu convergence distance in metres; 0 = infinity (identical eyes, the old
# behavior). Try 2.0 to bring the panel to a comfortable focus depth.
vr_menu_distance 0

# Gameplay HUD band scale: pulls compass/ammo in from the lens edge toward
# central vision. 0.88 still needed uncomfortable eye travel to read the
# corners; 0.70 read as "much better, could be slightly easier to see", so
# 0.73 grows the text a touch while corners stay inside easy glances. Raise
# it if the HUD feels cramped, lower toward 0.60 to centre it further.
vr_hud_scale 0.73

# Nudge the whole HUD band, as a fraction of the screen: positive horizontal
# = right, positive vertical = down. 3D frames only, like vr_hud_scale.
vr_hud_horizontal_offset 0.0
vr_hud_vertical_offset 0.0

# ------------------------------------------------------------ AIM STEERING

# The game's view angles are driven to the controller with injected relative
# mouse motion; counts-per-degree is measured live, so in-game sensitivity
# does not matter. Gain = fraction of the error corrected per frame.
vr_steer_gain 0.55
# Seed only (auto-calibrated): counts per degree = 1 / (sensitivity * m_yaw).
vr_steer_cpd 9.09

# Cursor speed when driving menus with the stick, px/sec.
vr_menu_cursor_speed 900


# ------------------------------------------------------------- ENGINE / DEBUG

# Which cgame syscall is R_RenderScene. Confirmed as 71 by call-site argument
# analysis plus a captured frame trace. There should be no reason to change it.
renderSyscall 71

# Diagnostic mode. 1 disables VR and runs the game FLAT on the monitor, writing
# a self-scoring verdict to codvr_result.log -- no headset needed. Only useful
# when something is badly wrong and we need to know which layer is at fault.
probe 0

# Scene replay: no longer used for stereo (frames alternate eyes instead, which
# removes the problem it existed to solve) but kept behind this switch. It
# disables itself automatically if it ever faults.
replay 1

# ---------------------------------------------------------------------------
# NATIVE CONTROLLER HANDS (the controller-hands candidate, 2026-08-28)
#
# The rendered RIGHT hand and the weapon follow the RIGHT controller in full
# 6DoF (the weapon pinned at its measured rear grip, carrying the authored
# palm->grip relation); the rendered LEFT hand follows the LEFT controller
# independently. Squeezing the LEFT grip near the fore-end attaches a sliding
# two-hand support; releasing returns to one-hand aim. The physical reload
# gesture (magazine out -> pouch -> insert, per-weapon measured zones) issues
# the engine reload exactly once. All ON by default -- there is no hidden
# mode; a supported weapon in a tracked hand IS the engagement condition.
# Unknown weapons and low-confidence data fail closed to the vanilla weapon.
vr_native_hands 1
vr_native_hands_twohand 1
vr_native_hands_reload 1
vr_native_hands_track_grace 0.5

# ---------------------------------------------- PHYSICAL AIM (2026-09-03)
# The rendered weapon's barrel is the game's aim. Each pair the native gun
# object's bore direction is converted against the body facing into the
# game's OWN view angles through the ordinary aim input (relative mouse),
# which is the state CoD's fire, spread, recoil and hit logic already read.
# The camera is composed on the body basis + HMD and never sees those
# angles; the steering-leak watchdog holds that invariant live and logs
# 'STEERING LEAK' if it ever fails. Arms the aim model and the steering
# loop together (overrides vr_aim_mode / vr_experimental_weapon above).
# Turn with the RIGHT stick as before; the 2D crosshair still marks the
# body-forward direction, not the gun -- set cg_drawCrosshair 0 in the
# game's config if it distracts.
vr_physical_aim 1

# Native hands: anatomical controller-grip -> palm-bone calibration from
# the shipped rig (src/vr_palm_calibration.inc), per hand and per rig. The
# vr_native_hands_{l,r}_* values above are trims applied on top of it.
# 0 = the raw grip frame (the pre-2026-09-03 alignment).
vr_native_hands_cal_table 1

# THE PALM ANCHOR (2026-09-04d). The controller owns the user's PALM: the
# calibration in src/vr_palm_calibration.inc is derived from the shipped
# skeleton and mesh against the OpenXR grip convention as specified, and the
# weapon is placed relative to that palm by the shipped authored holding
# relation. There is no runtime correction on top of it any more:
# vr_native_hands_palm_flip and vr_native_hands_gun_follow_fix are still
# parsed, so an older config loads, but they no longer change anything and
# the log says so. The pre-2026-09-04d table had the grip's Y and Z axes
# swapped, which put the palm 90 deg off about the palm normal -- the
# "controller owns the weapon body, not my hand" of the 2026-09-04d run.


// P0 2026-09-04: weapon surfaces reach GL in shader-sorted order, so a part
// can be drawn before the body keys the scene. Such a batch is placed by the
// previous scene's authored body (1) or not drawn (0). Never head-coupled.
# RIGHT-hand VISUAL trim (2026-09-04e): a rotation of the RENDERED right hand
# only, about the palm pivot, in the palm's own axes, degrees. The weapon,
# the bore, the aim and the left hand never see it. Ships at identity: the
# hold is the shipped authored one on the spec-derived palm.
vr_hand_r_visual_pitch 0
vr_hand_r_visual_yaw 0
vr_hand_r_visual_roll 0

vr_gun_prekey_policy 0

// P1 2026-09-04: the sleeve follows the wrist rigidly -- the forearm continues
// the knuckle line (straight wrist), pivot at the wrist, orientation from the
// drawn forearm. 0 = old behaviour (rigid with the hand, animation wrist bend).
// 2026-09-04d: the LEFT forearm still read as disconnected on hardware,
// and a forearm crossing the view is worse than none while weapon handling
// 2 = both sleeves, 1 = RIGHT only, 0 = floating hands (current default).
// The HANDS are never hidden by this.
vr_sleeve_visible 0

vr_sleeve_anatomical 1
// A sleeve whose elbow would land at or behind the eyes, or within 15 cm of
// them, is not drawn.
vr_sleeve_hide_near_head 1

// P2 2026-09-04: two-hand support as a rigid bar held at two points. Attach
// when the LEFT grip is squeezed within grab_cm of the legal fore-end segment
// (immediately); release on grip release or past release_cm; the segment
// slides +/- slide_cm about the measured support point; only the attach /
// release transition is blended (blend_s), steady control is rigid.
vr_twohand_grab_cm 12
vr_twohand_release_cm 25
vr_twohand_slide_cm 15
vr_twohand_blend_s 0.08

// The weapon's own trim on top of the right palm calibration (metres,
// degrees). Adjustable in-headset: hold the LEFT stick click for VR Options.
vr_gun_off_fwd 0
vr_gun_off_left 0
vr_gun_off_up 0
vr_gun_pitch 0
vr_gun_yaw 2.00
vr_gun_roll 0

# --- In-engine snapshots (2026-09-06) -------------------------------------
# Writes the finished eye images (what the headset shows, both eyes) as PNGs
# plus a telemetry sidecar to a `snapshots` folder beside the DLL, so a run
# can be reviewed offline. A pure readback: it arms no probe, capture or
# autoquit and leaves no GL state behind. Sources: a timer, and the RIGHT
# trigger press (every shot documents itself); both debounced, hard-capped.
vr_snapshot 1
vr_snapshot_interval_s 15
vr_snapshot_on_trigger 1
vr_snapshot_on_button 0
vr_snapshot_debounce_s 1.5
vr_snapshot_max 80
vr_snapshot_scale 2

# Comfort update: measured level hold; floating hands; assisted support.
# 2026-09-06 afternoon: the RIGHT pitch/yaw and the gun yaw below are the
# values the user saved from the headset's VR Options during the play test
# (-23.00 / -18.00 / 2.00), kept over the solved -22.66 / -3.18 / 0.
vr_native_hands_r_pitch -23.00
vr_native_hands_r_yaw -18.00
vr_native_hands_r_roll -3.30
vr_native_hands_l_pitch 22.71
vr_native_hands_l_yaw -2.91
vr_native_hands_l_roll 3.21
vr_twohand_stability 0.75
vr_twohand_recoil_reduction 0.80
vr_comfort_vignette 0

# --- Precision / display (2026-09-06 afternoon) ------------------------------
# vr_brightness: a linear gain on the finished eye image, applied by the proxy
# (the engine's r_gamma only reaches the headset through texture uploads and
# needs a restart). 1.0 = untouched; 0.85 takes the edge off. Live in VR Options.
vr_brightness 0.85
# vr_crosshair: the engine's aim reticle. 0 = off (the physical gun IS the
# sight). Mirrored into main\autoexec.cfg as cg_drawCrosshair whenever it is
# applied, so a change takes effect at the NEXT launch.
vr_crosshair 0
# vr_support_pose_lock: while the left grip holds the weapon, the LEFT hand is
# drawn where the game's own animation holds it (rigid on the gun, no
# clipping); the left controller still attaches/releases and reloads.
vr_support_pose_lock 1
# vr_trigger_hand_lock: the RIGHT hand is drawn where the game's animation
# holds it on the weapon whenever the weapon is native -- rigid with the gun
# through two-hand alignment, stabilisation, kick and the sighted animation.
# The controller still drives the weapon; only the drawn hand rides it.
vr_trigger_hand_lock 1
# The no-spread weapon override (dist\zz_codvr_precision.pk3, deployed into
# main\) has no key: remove the archive to restore stock spread.
vr_manual_reload_mode 2
vr_postprocess 1
vr_postprocess_sharpen 0.35
vr_postprocess_bloom 0
vr_postprocess_contrast 0.085
vr_postprocess_saturation 1.035
vr_postprocess_shadow_lift 0.01
