// ===========================================================================
// CoD1 VR -- engine-side config, applied at startup.
//
// Two jobs: (1) give the VR capture path a square-ish, correctly-scaled
// buffer, and (2) stop the engine throwing away image quality the headset
// then has to magnify.
//
// To go back to flat play, restore Main/autoexec.cfg.pre-vr-backup.
// ===========================================================================

// ---------------------------------------------------------------- geometry
//
// Each headset eye is 3072x3264 -- very nearly square -- while a 16:9 buffer
// spends most of its pixels on horizontal detail the eye cannot use and
// starves the vertical. A square refdef matches the eye far better, so the
// same pixel budget buys sharper vertical detail. (The mod's own scene target
// is then reshaped to the exact runtime eye aspect, so nothing is resampled
// unevenly on the way out; see VR: scene aspect ... in codvr_result.log.)
//
// Windowed on purpose: 1440x1440 is not a mode any monitor can display, so
// fullscreen would fail to set it. The mod renders offscreen and mirrors to
// the window anyway, so the window is only a preview.
seta r_mode "-1"
seta r_customwidth "1440"
seta r_customheight "1440"
seta r_customaspect "1"
seta r_fullscreen "0"
seta cg_fov "96.418"

// Skip legacy intro playback, which can fail at custom resolutions.
seta com_introplayed "1"

// The aim reticle: off by default -- the physical weapon is the sight. This
// line is mirrored from codvr.cfg's vr_crosshair by the proxy at every launch
// (and on a VR Options change), so set it THERE, not here.
seta cg_drawCrosshair "0"

// ------------------------------------------------------------------- gamma
//
// THE VR GAMMA PROBLEM, and why r_gamma alone could never fix it:
//
// id Tech 3 has two different places brightness can live.
//   * the HARDWARE GAMMA RAMP -- built from r_gamma and r_overBrightBits and
//     handed to the display at SCANOUT. It is applied to the monitor signal,
//     AFTER the framebuffer.
//   * the FRAMEBUFFER itself -- what the renderer actually draws.
//
// The VR capture reads the FRAMEBUFFER. The scanout ramp never reaches the
// headset, so with the stock arrangement the headset saw an image missing the
// ramp's contribution entirely, and r_gamma did nothing at all in VR.
//
// r_overBrightBits 0 was the previous workaround: it moves the whole
// overbright gain out of the ramp and into the framebuffer, where the capture
// can see it. That fixed "VR is too dark" and caused "VR is too bright and
// washed out" -- all the gain now sits in an 8-bit buffer with no headroom,
// so lit surfaces flatten and clip toward white.
//
// r_ignorehwgamma 1 is the engine's OWN answer to "this display cannot do a
// gamma ramp": it stops building the ramp and bakes the gamma curve into
// texture data at upload instead. That lands in the framebuffer, so it DOES
// reach the headset -- which finally makes r_gamma a live control in VR.
//
// r_gamma below 1.0 darkens. 0.85 is deliberately conservative: enough to put
// contrast and black level back without crushing shadow detail. Raise toward
// 1.0 if it now reads too dark; drop toward 0.75 if it still reads washed.
seta r_overBrightBits "0"
seta r_ignorehwgamma "1"
seta r_gamma "0.85"

// ------------------------------------------------------- image quality
//
// These were the single largest quality loss in the build, and none of it was
// deliberate -- they are the engine's cautious 2003 auto-detect defaults.
//
// r_picmip 2 / r_picmip2 3 discard mip levels at load: every world texture was
// being used at a QUARTER of its authored resolution and every second-class
// texture at an EIGHTH. In VR that loss is then magnified by the headset
// optics, which is most of what "it looks soft" was. 0 = use the art as
// shipped. This costs VRAM and bandwidth, not CPU.
seta r_picmip "0"
seta r_picmip2 "0"

// 32-bit texture storage instead of the auto-detected 16-bit. 16-bit banding
// is very visible on the sky and on smooth walls, and doubly so in a headset.
seta r_texturebits "32"
seta r_colorbits "32"

// Trilinear instead of GL_LINEAR_MIPMAP_NEAREST. The "NEAREST" is the MIP
// selection, and it produces a visible seam where the mip level changes --
// a moving band across the ground as you walk, very obvious in VR.
seta r_texturemode "GL_LINEAR_MIPMAP_LINEAR"

// This SP engine forcibly disables its anisotropy availability cvar even
// when the driver supports the extension. The VR proxy applies the driver's
// supported maximum to mipmapped textures without changing this engine flag.

// Proper box-filtered mipmaps rather than the cheap path.
seta r_simpleMipMaps "0"

// Detail textures and sun shafts are part of CoD's own look; keep them.
seta r_detailtextures "1"
seta r_drawSun "1"

// Dynamic lights (muzzle flashes, explosions lighting the world) were off.
// This is original art direction, not an embellishment.
seta r_dynamiclight "1"
seta r_dlightQuality "1"
seta r_diffuseSunQuality "2"
seta r_diffuseSunSteps "3"
seta r_maxEntLights "8"
seta r_fastsky "0"
seta r_flares "1"

// Preserve the engine's supported world effects and persistent scene detail.
seta cg_marks "1"
// cg_shadows is a developer/cheat-only blob-shadow control, reset by normal
// missions. Do not enable global cheats or force an unverified stencil mode.
seta cg_brass "1"
seta ai_corpseCount "64"

// The game's own "Model Detail: Maximum" preset is exactly scale 0 / bias 0.
// It selects the highest available geometry LOD instead of moving the LOD
// transitions farther away (scale 1 is only the menu's Normal preset).
seta r_lodbias "0"
seta r_lodscale "0"

// ------------------------------------------------------------- pacing
//
// Remove both the engine FPS cap and the vsync refresh cap: the VR pair
// scheduler needs roughly two game frames per XR frame (~240/s for a 120 Hz
// headset), and any engine-side cap starves it.
seta com_maxfps "0"
seta r_swapInterval "0"

// If the frame rate no longer keeps up after the quality changes above, the
// supersample factor in codvr.cfg is by far the cheapest thing to trade
// (2.25 -> 1.75 -> 1.5). Lower picmip only as a last resort -- it is the
// setting that was hurting the image most.
